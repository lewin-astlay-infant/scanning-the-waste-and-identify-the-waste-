<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Management Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <h1 class="app-title">♻️ Smart Waste Management Portal</h1>

    <div class="login-box">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="userType">Select User Type</label>
        <select id="userType" required>
          <option value="">-- Choose --</option>
          <option value="worker">Worker</option>
          <option value="citizen">Citizen</option>
          <option value="admin">Admin</option>
          <option value="buyer">E-Commerce Buyer</option>
          <option value="driver">Truck Driver</option>
        </select>

        <label for="username">Username / Email</label>
        <input type="text" id="username" placeholder="Enter username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </div>

    <footer>
      <p>© 2025 Smart Waste Management | EcoIndia Initiative</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
